# Sandbox-only main nginx config: the repo root is mounted 0700 root:root, so the
# stock `user nginx;` workers cannot traverse it. Running workers as root keeps the
# bind-mounted source readable (development preview only).
user  root;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
